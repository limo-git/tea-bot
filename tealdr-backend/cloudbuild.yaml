# Google Cloud Build configuration for automated deployments
steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/tealdr-bot:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/tealdr-bot:latest'
      - '.'
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/tealdr-bot:$COMMIT_SHA'
  
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/tealdr-bot:latest'
  
  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'tealdr-bot'
      - '--image'
      - 'gcr.io/$PROJECT_ID/tealdr-bot:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '1'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '3600'
      - '--no-cpu-throttling'

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/tealdr-bot:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/tealdr-bot:latest'

# Build timeout
timeout: 1200s
